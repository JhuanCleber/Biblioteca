spring.application.name=matemagicos


spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration


spring.datasource.url=jdbc:mysql://localhost:3306/app_biblioteca?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=utf8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always


# Access token: dura pouco de propósito (é o que viaja em toda requisição).
# Antes era 24h (86400000) — agora 30min. Quem mantém a sessão viva por mais
# tempo é o refresh token, guardado com mais cuidado e usado só pra renovar.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=1800000

# Refresh token: validade longa (30 dias). Guardado no banco (tabela refresh_tokens),
# não é um JWT — é só um valor aleatório que dá pra revogar (logout, sessão comprometida etc.)
jwt.refresh-expiration-ms=2592000000


# Código de recuperação de senha: 15 minutos de validade
password-reset.expiration-ms=900000


# Envio de email (recuperação de senha). Usa uma "senha de app" do Gmail, não a senha
# normal da conta — gera em myaccount.google.com/apppasswords (precisa ter verificação
# em 2 etapas ativada na conta). MAIL_USERNAME é o email completo (ex: matemagicos.app@gmail.com).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


server.port=8080


management.endpoints.web.exposure.include=mappings,health


logging.level.org.springframework.security=INFO
logging.level.com.matemagicos.biblioteca=DEBUG