spring.application.name=matemagicos


spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration


spring.datasource.url=jdbc:mysql://localhost:3306/app_biblioteca?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=utf8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always


jwt.secret=${JWT_SECRET}

jwt.expiration-ms=86400000


server.port=8080


management.endpoints.web.exposure.include=mappings,health


logging.level.org.springframework.security=INFO
logging.level.com.matemagicos.biblioteca=DEBUG