spring.application.name=matemagicos

# --- MySQL DataSource ---
spring.datasource.url=jdbc:mysql://localhost:3306/app_biblioteca?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=utf8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# 'update' mantém os dados entre reinicializações; 'create' apaga tudo a cada start.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
# Chave usada para assinar os tokens. Vem de variável de ambiente — nunca fica no código.
jwt.secret=${JWT_SECRET}
# Tempo de validade do token em milissegundos (aqui: 24 horas)
jwt.expiration-ms=86400000

# --- Server ---
server.port=8080

# --- Actuator ---
management.endpoints.web.exposure.include=mappings,health

# --- Logging ---
logging.level.org.springframework.security=INFO
logging.level.com.matemagicos.biblioteca=DEBUG
